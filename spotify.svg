<svg xmlns="http://www.w3.org/2000/svg" width="440" height="135" viewBox="0 0 440 135" fill="none">
  <style>
    .bg { fill: #121212; stroke: #282828; stroke-width: 1.5; rx: 14px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #B3B3B3; }
    .status { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1DB954; letter-spacing: 0.5px; }
    .time { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #B3B3B3; }
    
    @keyframes bounce1 { 0%, 100% { height: 4px; y: 22px; } 50% { height: 16px; y: 10px; } }
    @keyframes bounce2 { 0%, 100% { height: 16px; y: 10px; } 50% { height: 6px; y: 20px; } }
    @keyframes bounce3 { 0%, 100% { height: 8px; y: 18px; } 50% { height: 20px; y: 6px; } }
    @keyframes bounce4 { 0%, 100% { height: 18px; y: 8px; } 50% { height: 8px; y: 18px; } }
    
    .bar1 { animation: bounce1 1.2s ease-in-out infinite; }
    .bar2 { animation: bounce2 1.0s ease-in-out infinite; }
    .bar3 { animation: bounce3 1.4s ease-in-out infinite; }
    .bar4 { animation: bounce4 1.1s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="438" height="133" x="1" y="1" />

  <!-- Album Art with Music Note Icon -->
  <rect x="18" y="22" width="90" height="90" rx="8" fill="#181818" stroke="#282828" stroke-width="1"/>
  <!-- Spotify Vinyl / Disc gradient -->
  <circle cx="63" cy="67" r="34" fill="#222" stroke="#333" stroke-width="1.5"/>
  <circle cx="63" cy="67" r="14" fill="#1DB954"/>
  <circle cx="63" cy="67" r="5" fill="#121212"/>

  <!-- Spotify Header & Equalizer -->
  <g transform="translate(124, 22)">
    <!-- Spotify Logo -->
    <path d="M12 0C5.37 0 0 5.37 0 12c0 6.63 5.37 12 12 12s12-5.37 12-12c0-6.63-5.37-12-12-12zm5.5 17.3c-.22.36-.68.47-1.04.25-2.85-1.74-6.44-2.14-10.67-1.17-.41.1-.82-.16-.91-.57-.1-.41.16-.82.57-.91 4.63-1.06 8.6-.61 11.8 1.34.36.23.47.69.25 1.06zm1.47-3.27c-.28.45-.87.59-1.32.31-3.26-2-8.23-2.58-12.08-1.41-.5.15-1.03-.13-1.18-.63-.15-.5.13-1.03.63-1.18 4.41-1.34 9.89-.69 13.64 1.59.45.28.59.87.31 1.32zm.13-3.4c-3.91-2.32-10.36-2.54-14.1-1.4-.6.18-1.24-.16-1.42-.76-.18-.6.16-1.24.76-1.42 4.3-1.3 11.41-1.05 15.9 1.62.54.32.72 1.03.4 1.57-.32.53-1.02.71-1.54.39z" fill="#1DB954" transform="scale(0.8)"/>
    
    <text x="26" y="14" class="status">PLAYING ON SPOTIFY</text>

    <!-- Animated Equalizer Bars -->
    <g transform="translate(260, 0)">
      <rect class="bar1" x="0" y="10" width="3.5" height="16" rx="1.5" fill="#1DB954" />
      <rect class="bar2" x="6" y="8" width="3.5" height="18" rx="1.5" fill="#1DB954" />
      <rect class="bar3" x="12" y="6" width="3.5" height="20" rx="1.5" fill="#1DB954" />
      <rect class="bar4" x="18" y="12" width="3.5" height="14" rx="1.5" fill="#1DB954" />
    </g>
  </g>

  <!-- Track Info -->
  <text x="124" y="68" class="title">Coding &amp; Deep Focus Session</text>
  <text x="124" y="86" class="artist">Isael Rivera • Lo-Fi &amp; Synthwave Mix</text>

  <!-- Progress Bar -->
  <g transform="translate(124, 102)">
    <!-- Background track -->
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#3E3E3E" />
    <!-- Active progress -->
    <rect x="0" y="0" width="165" height="4" rx="2" fill="#1DB954" />
    <circle cx="165" cy="2" r="4.5" fill="#FFFFFF" />
    <!-- Time stamps -->
    <text x="250" y="5" class="time">2:38 / 3:45</text>
  </g>
</svg>
